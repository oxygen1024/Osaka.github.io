---
layout: null
---
{%- assign ver = site.time | date: "%s" -%}
<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>京都・大阪 7日6夜自由行</title>
  <meta name="theme-color" content="#c8102e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="關西之旅">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.png">
  <link rel="stylesheet" href="assets/style.css?v={{ ver }}">
</head>
<body data-repo="{{ site.github.repository_nwo | default: 'oxygen1024/Osaka.github.io' }}" data-branch="{{ site.github.source.branch | default: 'main' }}" data-ver="{{ ver }}">
  <header class="top">
    <h1 id="trip-title">京都・大阪 7日6夜自由行</h1>
    <p id="trip-sub"></p>
    <button type="button" class="sync" id="sync" data-tab="settings"></button>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <main id="main"><p class="muted">載入中…</p></main>
  <footer>網站版本：{{ site.time | date: "%Y-%m-%d %H:%M" }} (UTC)</footer>

  <!-- 編輯表單 -->
  <div class="sheet" id="sheet" hidden>
    <form class="sheet-body" id="edit-form" autocomplete="off">
      <div class="sheet-head">
        <b id="edit-title">編輯行程</b>
        <button type="button" class="icon" data-close aria-label="關閉">✕</button>
      </div>
      <label>時間<input name="time" placeholder="例如 14:30"></label>
      <label>名稱 / 做乜 *<input name="what" required></label>
      <div class="two">
        <label>狀態
          <select name="status">
            <option value="">—</option>
            <option value="confirmed">✅ 已確認</option>
            <option value="pending">🟠 待處理</option>
          </select>
        </label>
        <label>優先度
          <select name="priority">
            <option value="">—</option>
            <option value="high">🔴 高（必去）</option>
            <option value="mid">🔵 中</option>
            <option value="low">⚪ 低（得閒先去）</option>
          </select>
        </label>
      </div>
      <label>地址<input name="address"></label>
      <label>地圖搜尋字（Google Maps）<input name="place" placeholder="留空就用地址"></label>
      <div class="two">
        <label>電話<input name="phone" type="tel"></label>
        <label>預約編號<input name="ref"></label>
      </div>
      <label>備註<textarea name="note" rows="3"></textarea></label>
      <div class="two">
        <label>放喺邊日<select name="day"></select></label>
        <div class="move">
          <span>次序</span>
          <div>
            <button type="button" class="btn" data-move="-1">⬆️ 上移</button>
            <button type="button" class="btn" data-move="1">⬇️ 下移</button>
          </div>
        </div>
      </div>
      <div class="sheet-actions">
        <button type="button" class="btn danger" id="edit-delete">🗑 刪除</button>
        <button type="submit" class="btn primary">💾 儲存</button>
      </div>
    </form>
  </div>

  <!-- 編輯當日 -->
  <div class="sheet" id="day-sheet" hidden>
    <form class="sheet-body" id="day-form" autocomplete="off">
      <div class="sheet-head">
        <b>編輯當日資料</b>
        <button type="button" class="icon" data-close aria-label="關閉">✕</button>
      </div>
      <label>當日主題<input name="title"></label>
      <label>⚠️ 提示（留空就唔顯示）<input name="alert"></label>
      <div class="sheet-actions">
        <span></span>
        <button type="submit" class="btn primary">💾 儲存</button>
      </div>
    </form>
  </div>

  <!-- 相片檢視 -->
  <div class="viewer" id="viewer" hidden>
    <button type="button" class="close" aria-label="關閉">✕</button>
    <img alt="">
    <p class="caption"></p>
    <button type="button" class="btn danger" id="photo-delete" hidden>🗑 刪除呢張相</button>
  </div>

  <input type="file" id="file-input" accept="image/*,application/pdf" multiple hidden>
  <div class="toast" id="toast" hidden></div>

  <script src="assets/app.js?v={{ ver }}"></script>
</body>
</html>
